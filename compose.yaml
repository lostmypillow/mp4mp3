services:
  mp4mp3:
    image: mp4mp3
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.dev
    environment:
      AWS_PROFILE: ""
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  
  minio:
    image: minio/minio:latest
    container_name: minio-server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "password123"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MINIO_NOTIFY_WEBHOOK_ENABLE_primary: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_primary: "http://mp4mp3:3000/convert/events"
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  minio-init:
    image: minio/mc
    depends_on:
      - minio
      - mp4mp3
    entrypoint: |
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until mc alias set localminio http://minio:9000 admin password123; do
        sleep 2;
      done;
      sleep 3;
      
      # 1. Create target bucket
      mc mb --ignore-existing localminio/my-bucket;
      
      # 2. Set bucket permissions
      mc anonymous set upload localminio/my-bucket;
      
      # 3. Attach 'Object Created' webhook event listener (Matches EventBridge rule)
      mc event add localminio/my-bucket arn:minio:sqs::primary:webhook --event put;
      
      # 4. Add 7-day object lifecycle expiration rule
      mc ilm rule add --expire-days 1 localminio/my-bucket;
      
      echo 'MinIO initialization complete!';
      exit 0;
      "
