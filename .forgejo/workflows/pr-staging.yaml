name: CI & Staging Deploy (PR)

on:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run CI Checks (Typecheck, Lint & Vitest)
        run: npm run ci

  deploy-staging:
    name: Deploy Staging Stack
    needs: test
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Deploy Self-Hosted Dev Containers
        run: |
          echo "Deploying updated Docker containers to Dev environment..."
          docker compose -f compose.dev.yaml down
          docker compose -f compose.dev.yaml up -d --build