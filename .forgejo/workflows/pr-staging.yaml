name: CI & Staging Deploy (PR)

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify WARP Outbound Routing
        run: |
            echo "=== Proxy Environment Variables ==="
            env | grep -iE 'proxy' || echo "No proxy env set"
            
            echo "=== Cloudflare Trace ==="
            curl -fsSL https://cloudflare.com/cdn-cgi/trace | grep -E 'ip|colo|warp'
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run CI Checks (Typecheck, Lint & Vitest)
        run: npm run ci

