name: CI & Production Deploy (Main)

on:
  push:
    branches: [ main ]

jobs:
  deploy-frontend:
    name: Deploy prod website to MinIO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build website
        run: npm run build:prod --workspace=frontend

      - name: Deploy website
        run: npm run deploy:prod --workspace=frontend


  deploy-api:
    name: Deploy prod API to Docker
    needs: [deploy-frontend]
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Deploy Self-Hosted Dev Containers
        run: |
          echo "Deploying updated Docker containers to Dev environment..."
          docker compose -f compose.prod.yaml down
          docker compose -f compose.prod.yaml up -d --build