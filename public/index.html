<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MP4 => MP3 轉檔 0.1.0</title>
</head>
<body>
<main class="container-fluid">
<h1>MP4 => MP3 轉檔</h1>
<span>選擇 MP4 檔完按 『開始轉檔』</span>
<br/>
    <article><input type="file" id="fileInput" accept="video/mp4"></article>

<br/>
<link rel="stylesheet" href="stylesheets/pico.blue.css">
<button id="convertBtn">開始轉檔</button>
<div id="status" style="margin-top: 15px;"></div>
<progress id="progress" max="100" value="0">0%</progress>
</main>
<script>
    document.getElementById('fileInput').value = '';
    document.getElementById('convertBtn').addEventListener('click', async () => {

        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const progressDiv = document.getElementById('progress');
        progressDiv.setAttribute('value', '0');

        if (!fileInput.files.length) {
            statusDiv.innerText = 'Please select an MP4 file first.';
            return;
        }

        const file = fileInput.files[0];
        const sessionId = Math.random().toString(36).substring(2, 15);

        statusDiv.innerText = 'Initializing real-time progress channel...';

        try {
            const cleanedFilename = file.name
                .replace(/[\u200B-\u200D\uFEFF]/g, '') 
                .replace(/[^\x20-\x7E\u4E00-\u9FFF]/g, ''); 
            
            const utf8Bytes = new TextEncoder().encode(file.name);
            const base64Filename = btoa(String.fromCharCode(...utf8Bytes));

            // 1. Open the real-time progress channel first
            const eventSource = new EventSource(`/progress?id=${sessionId}`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.status === 'converting') {
                    statusDiv.innerText = 'Upload complete. Processing audio extraction...';
                } else if (data.status === 'progress') {
                    progressDiv.setAttribute('value', `${data.progress}`);
                    statusDiv.innerText = `Converting... ${data.progress}%`;
                } else if (data.status === 'done') {
                    statusDiv.innerText = 'Success! Triggering your file download...';
                    eventSource.close();

                    const downloadLink = document.createElement('a');
                    downloadLink.href = data.downloadUrl;
                    downloadLink.download = data.filename;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                } else if (data.status === 'error') {
                    statusDiv.innerText = `Error: ${data.message}`;
                    eventSource.close();
                }
            };

            // 2. Wait for the SSE connection to open before uploading
            eventSource.onopen = async () => {
                statusDiv.innerText = 'Uploading raw file buffer...';
                
                try {
                    const response = await fetch(`/convert?id=${sessionId}`, {
                        method: 'PUT',
                        body: file,
                        headers: {
                            'Content-Type': 'video/mp4',
                            'X-File-Name': base64Filename
                        }
                    });

                    if (!response.ok) {
                        statusDiv.innerText = 'Server rejected the file transfer or media extraction failed.';
                        eventSource.close();
                    }
                } catch (uploadErr) {
                    statusDiv.innerText = `Upload failed: ${uploadErr.message}`;
                    eventSource.close();
                }
            };

            eventSource.onerror = () => {
                statusDiv.innerText = 'Failed to establish connection with the server.';
                eventSource.close();
            };

        } catch (err) {
            statusDiv.innerText = `Client preparation failure: ${err.message}`;
        }
    });
</script>
</body>
</html>
